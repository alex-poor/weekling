# cargo-deny configuration — supply-chain gate run in CI.

[advisories]
# Fail on any known vulnerability; tune with explicit, commented ignores only.
ignore = []

[licenses]
# Our own crate is AGPL-3.0; it is not published, so skip it here and vet deps.
private = { ignore = true }
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "0BSD",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
