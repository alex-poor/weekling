# cargo-deny configuration — supply-chain gate run in CI.

[advisories]
# Fail on any known vulnerability; tune with explicit, commented ignores only.
ignore = [
    # Marvin timing attack on RSA *private-key* ops (no fixed release yet). Reached
    # only via openidconnect, which uses `rsa` to VERIFY id_token signatures with the
    # IdP's PUBLIC key — the vulnerable private-key path is never exercised here.
    "RUSTSEC-2023-0071",
]

[licenses]
# Our own crate is AGPL-3.0; it is not published, so skip it here and vet deps.
private = { ignore = true }
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "0BSD",
    "CDLA-Permissive-2.0", # webpki-roots (Mozilla CA bundle, a data license)
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
