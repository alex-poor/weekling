# Weekling configuration. Copy to `weekling.toml` (or point WEEKLING_CONFIG at it).
# Every value can also be set via WEEKLING_<KEY> environment variables, which win.

# Address to listen on.
bind = "0.0.0.0:5232"

# Where the SQLite database (and later, certs) live.
data_dir = "/var/lib/weekling"

# Shown in the management UI.
server_name = "Weekling"

# Max request body size in bytes (10 MiB).
max_body_bytes = 10485760
