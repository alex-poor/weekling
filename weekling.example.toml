# Weekling configuration. Copy to `weekling.toml` (or point WEEKLING_CONFIG at it).
# Every value can also be set via WEEKLING_<KEY> environment variables, which win.

# Address to listen on.
bind = "0.0.0.0:5232"

# Where the SQLite database (and later, certs) live.
data_dir = "/var/lib/weekling"

# Shown in the management UI.
server_name = "Weekling"

# Max request body size in bytes (10 MiB).
max_body_bytes = 10485760

# TLS. mode = "off" serves plain HTTP (terminate TLS at a reverse proxy).
#   "files" loads a cert/key pair; "acme" gets a Let's Encrypt cert automatically
#   (needs the domain(s) to resolve here and port 443 reachable from the internet).
[tls]
mode = "off"
# For mode = "files":
# cert_file = "/etc/weekling/cert.pem"
# key_file  = "/etc/weekling/key.pem"
# For mode = "acme":
# domains = ["calendar.example.com"]
# email   = "you@example.com"
# staging = false            # true while testing (avoids Let's Encrypt rate limits)
# cache_dir = ""             # defaults to <data_dir>/acme

# OIDC single sign-on for the management UI (Authentik / Keycloak / Google, …).
# Enabled when issuer + client_id are set. The username (preferred_username, else
# email) claim is matched to an existing Weekling user — no auto-provisioning.
[oidc]
# issuer = "https://id.example.com/application/o/weekling/"
# client_id = "weekling"
# client_secret = "…"
# redirect_url = "https://calendar.example.com/api/oidc/callback"
# scopes = ["email", "profile"]   # "openid" is always added
