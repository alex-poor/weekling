services:
  weekling:
    image: weekling:local
    build: .
    container_name: weekling
    ports:
      - "5232:5232"
    environment:
      WEEKLING_SERVER_NAME: "My Weekling"
      # WEEKLING_BIND defaults to 0.0.0.0:5232 inside the container.
    volumes:
      - weekling-data:/var/lib/weekling
    restart: unless-stopped

    # Hardening: runs as the image's nonroot user (uid 65532) on a read-only
    # root filesystem, with no extra capabilities and no privilege escalation.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  weekling-data:
