version: 2
updates:
  # Rust crates
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      cargo:
        patterns: ['*']
    ignore:
      # Pinned to 0.8 to match rustls-acme's AxumAcceptor; a 0.9 bump creates two
      # axum-server versions and breaks TLS/ACME. Unpin once rustls-acme updates.
      - dependency-name: 'axum-server'
        versions: ['>=0.9']

  # SvelteKit UI
  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      ui:
        patterns: ['*']

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  # Dockerfile base images
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
