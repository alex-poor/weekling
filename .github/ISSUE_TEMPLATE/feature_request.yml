name: 💡 Feature request
description: Suggest an improvement (for open-ended ideas, Discussions is great too)
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the need from your side of the screen.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
  - type: markdown
    attributes:
      value: |
        Weekling aims to stay **small and focused** — enough CalDAV for real home/family/small-team
        use, not every RFC corner. Proposals that keep it lean are most likely to land.
