name: 🐛 Bug report
description: Something isn't working the way it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report! Please include enough for us to reproduce it.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: CalDAV client / app (if relevant)
      placeholder: Thunderbird 128, DAVx⁵ 4.4, Apple Calendar on iOS 18…
  - type: input
    id: version
    attributes:
      label: Weekling version / commit
      placeholder: v0.1.0 or a commit hash
    validations:
      required: true
  - type: dropdown
    id: deploy
    attributes:
      label: How are you running it?
      options:
        - Docker / Compose
        - Binary (systemd)
        - cargo run
        - Other
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Run with `WEEKLING_LOG=debug` and paste the relevant lines.
      render: text
